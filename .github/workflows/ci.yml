name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run balance
      - run: npm run build
      - name: Browser tests (crisis turns, debrief, accessibility)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Bundle must stay under 16 MB
        run: |
          size_kb=$(du -sk dist | cut -f1)
          echo "dist is ${size_kb} KB"
          test "$size_kb" -lt 16384
